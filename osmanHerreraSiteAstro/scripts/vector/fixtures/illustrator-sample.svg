<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 800 800" style="enable-background:new 0 0 800 800;" xml:space="preserve">
<style type="text/css">
	.st0{fill:#118AB2;stroke:#073B4C;stroke-width:2;}
	.st1{fill:#EF476F;}
	.st2{fill:#06D6A0;}
	.st3{fill:#FFD166;}
</style>
<defs>
	<clipPath id="SVGID_1_">
		<rect x="50" y="50" width="300" height="300"/>
	</clipPath>
	<path id="reusable-star" class="st3" d="M0-20L6-6L20,0L6,6L0,20L-6,6L-20,0L-6-6Z"/>
	<g id="hidden-template">
		<circle cx="20" cy="20" r="10"/>
		<rect x="10" y="10" width="20" height="20"/>
	</g>
</defs>

<!-- 1. Illustrator compact path con números adyacentes y coordenadas relativas -->
<path class="st0" d="M12.5-3.2c-1.2,0-2.3.9-2.3,2.1l4.5.5h-3z" transform="translate(150 150) scale(4)"/>

<!-- 2. Grupo con translate y path con arco 'A' -->
<g transform="translate(40 20)">
	<path class="st1" d="M200,200 A50,50 0 0,1 300,200 L300,250 L200,250 Z"/>
</g>

<!-- 3. Rect con matrix (rotación de 45 grados y traslación) -->
<rect class="st2" x="10" y="10" width="80" height="60" transform="matrix(0.7071 0.7071 -0.7071 0.7071 100 50)"/>

<!-- 4. Grupo con rotate(30 200 200) y clipPath aplicado -->
<g transform="rotate(30 200 200)" clip-path="url(#SVGID_1_)">
	<polygon class="st1" points="180,180 220,180 200,220"/>
	<circle class="st0" cx="200" cy="200" r="15"/>
</g>

<!-- 5. Instancia use que referencia a reusable-star -->
<use xlink:href="#reusable-star" x="500" y="300" transform="scale(2)"/>

<!-- 6. Elemento oculto fuera de defs (debe ser ignorado) -->
<rect x="50" y="50" width="100" height="100" style="display:none;fill:#000000;"/>
</svg>
