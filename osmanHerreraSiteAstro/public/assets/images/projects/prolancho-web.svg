<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#002022" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#090a0d"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- Border & Chamfer -->
  <path d="M 40 40 L 1120 40 L 1160 80 L 1160 710 L 40 710 Z" fill="none" stroke="#253238" stroke-width="2"/>
  <line x1="1120" y1="40" x2="1160" y2="80" stroke="#00f0ff" stroke-width="3"/>

  <!-- Corner Marks -->
  <path d="M 60 75 L 60 60 L 75 60" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 1140 675 L 1140 690 L 1125 690" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 60 675 L 60 690 L 75 690" fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- Technical Header -->
  <text x="80" y="100" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="4" font-weight="600">EXP_PREVIEW // DOSSIER PROJECT 01</text>
  <rect x="80" y="120" width="1040" height="1" fill="#253238"/>

  <!-- Central Badge -->
  <g transform="translate(600, 340)">
    <rect x="-180" y="-30" width="360" height="60" fill="#0e1217" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="0" y="8" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="3">CAPTURA PENDIENTE</text>
  </g>

  <!-- Project Title -->
  <text x="600" y="450" fill="#e0e8eb" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="1">Fundación Prolancho — Sitio Web</text>
  <text x="600" y="490" fill="#758890" font-family="'JetBrains Mono', monospace" font-size="16" text-anchor="middle" letter-spacing="2">ANGULAR 15 · NODEJS · MONGODB · AWS EC2</text>

  <!-- Footer telemetry -->
  <text x="80" y="670" fill="#4a5f68" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2">SYS_ID: PROLANCHO-WEB // STATUS: PRODUCTION</text>
  <text x="1120" y="670" fill="#4a5f68" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2" text-anchor="end">1200x750 · 60HZ</text>
</svg>
