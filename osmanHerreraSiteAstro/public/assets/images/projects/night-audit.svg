<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#12151c" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b202a" stroke-width="1" />
    </pattern>

    <!-- Subtle Cyan Glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bg)" />
  <rect width="1200" height="750" fill="url(#grid)" />
  <rect width="1200" height="750" fill="url(#glow)" />

  <!-- Outer Technical Border & Corner Marks -->
  <rect x="30" y="30" width="1140" height="690" fill="none" stroke="#222834" stroke-width="1.5" />
  
  <!-- Corners -->
  <path d="M 24 40 L 40 40 L 40 24" fill="none" stroke="#00f0ff" stroke-width="2" />
  <path d="M 1176 40 L 1160 40 L 1160 24" fill="none" stroke="#00f0ff" stroke-width="2" />
  <path d="M 24 710 L 40 710 L 40 726" fill="none" stroke="#00f0ff" stroke-width="2" />
  <path d="M 1176 710 L 1160 710 L 1160 726" fill="none" stroke="#00f0ff" stroke-width="2" />

  <!-- Technical Header Strip -->
  <g transform="translate(60, 70)">
    <text font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#00f0ff" font-weight="600" letter-spacing="2">AUTOMATION / DATA PIPELINE // SYSTEM 04</text>
    <text x="1080" y="0" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#5eead4" opacity="0.6">190 TRANSACTION CODES // ZERO TOLERANCE</text>
  </g>

  <!-- Pipeline Diagram Stages -->
  <g transform="translate(100, 220)">
    <!-- Stage 1: Oracle OPERA / RPA -->
    <g transform="translate(0, 0)">
      <rect width="180" height="110" rx="4" fill="#141822" stroke="#2e3748" stroke-width="1.5" />
      <text x="20" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffb703" font-weight="600">STAGE 01: RPA</text>
      <text x="20" y="65" font-family="'Inter', sans-serif" font-size="14" fill="#ffffff" font-weight="600">Oracle OPERA</text>
      <text x="20" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">PyAutoGUI · 3 PDFs</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 195 55 L 255 55" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="260,55 252,50 252,60" fill="#00f0ff" />

    <!-- Stage 2: Extract & Parse -->
    <g transform="translate(275, 0)">
      <rect width="180" height="110" rx="4" fill="#141822" stroke="#2e3748" stroke-width="1.5" />
      <text x="20" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f0ff" font-weight="600">STAGE 02: PARSE</text>
      <text x="20" y="65" font-family="'Inter', sans-serif" font-size="14" fill="#ffffff" font-weight="600">PDF Extraction</text>
      <text x="20" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">pdfplumber · regex</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 470 55 L 530 55" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="535,55 527,50 527,60" fill="#00f0ff" />

    <!-- Stage 3: Classify & Validate -->
    <g transform="translate(550, 0)">
      <rect width="180" height="110" rx="4" fill="#141822" stroke="#00f0ff" stroke-width="1.5" />
      <text x="20" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f0ff" font-weight="600">STAGE 03: ETL</text>
      <text x="20" y="65" font-family="'Inter', sans-serif" font-size="14" fill="#ffffff" font-weight="600">pandas Integrity</text>
      <text x="20" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5eead4">190 Codes · Fail-loud</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 745 55 L 805 55" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="810,55 802,50 802,60" fill="#00f0ff" />

    <!-- Stage 4: Financial Excel -->
    <g transform="translate(825, 0)">
      <rect width="180" height="110" rx="4" fill="#141822" stroke="#2e3748" stroke-width="1.5" />
      <text x="20" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffb703" font-weight="600">STAGE 04: OUTPUT</text>
      <text x="20" y="65" font-family="'Inter', sans-serif" font-size="14" fill="#ffffff" font-weight="600">Revenue Book</text>
      <text x="20" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">openpyxl · Macros OK</text>
    </g>
  </g>

  <!-- Big Central Title & Metrics -->
  <g transform="translate(100, 450)">
    <text font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
      Night Audit Revenue Report Pipeline
    </text>
    <text y="45" font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#94a3b8" max-width="800">
      End-to-end Python automation eliminating 2-4 hours of manual financial reconciliation per shift down to ~5 minutes.
    </text>

    <!-- Badges / Metrics -->
    <g transform="translate(0, 85)">
      <!-- Badge 1 -->
      <rect width="140" height="34" rx="4" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-opacity="0.4" />
      <text x="70" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f0ff" font-weight="600">2-4h → 5 MIN</text>

      <!-- Badge 2 -->
      <rect x="155" width="160" height="34" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="235" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">190 PMS CODES</text>

      <!-- Badge 3 -->
      <rect x="330" width="160" height="34" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="410" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">ZERO SILENT ERRORS</text>
    </g>
  </g>

  <!-- Footer Watermark / Tech Stack -->
  <g transform="translate(100, 680)">
    <text font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">
      STACK: Python · pandas · openpyxl · pdfplumber · PyMuPDF · tabula · regex · PyAutoGUI
    </text>
  </g>
</svg>
