<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <title>Nombre secreto</title>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Metadato Secreto No Indexable</dc:title>
        <dc:creator>Osman Herrera</dc:creator>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#006970" />
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbb400" />
      <stop offset="100%" stop-color="#ffd795" />
    </linearGradient>
  </defs>
  <g id="Capa_personaje" data-name="Capa_personaje">
    <!-- Fondo y placas base del casco -->
    <path fill="#0d0e13" d="M 150 150 L 650 150 L 680 500 L 400 720 L 120 500 Z" />
    <path fill="#1a1b20" stroke="#3b494b" stroke-width="3" d="M 200 200 L 600 200 L 620 460 L 400 660 L 180 460 Z" />
    <!-- Visor cibernético con gradiente cian -->
    <path fill="url(#cyan-glow)" stroke="#00f0ff" stroke-width="2" d="M 230 320 L 570 320 L 540 430 L 400 490 L 260 430 Z" />
    <!-- Placas de armadura dorada -->
    <path fill="url(#amber-accent)" d="M 280 230 L 520 230 L 500 290 L 300 290 Z" />
    <path fill="#ffd795" d="M 380 180 L 420 180 L 410 240 L 390 240 Z" />
    <!-- Detalles mecánicos laterales y mandíbula -->
    <path fill="#292a2f" stroke="#849495" stroke-width="1.5" d="M 240 480 L 360 510 L 340 600 L 230 540 Z" />
    <path fill="#292a2f" stroke="#849495" stroke-width="1.5" d="M 560 480 L 440 510 L 460 600 L 570 540 Z" />
    <path fill="#00dbe9" d="M 370 540 L 430 540 L 400 620 Z" />
    <!-- Líneas de respiraderos y acentos de luz -->
    <path fill="#38393e" d="M 320 370 L 480 370 L 470 390 L 330 390 Z" />
    <circle cx="400" cy="260" r="16" fill="#00f0ff" />
    <polygon points="360,650 440,650 400,700" fill="#ffd795" />
  </g>
</svg>
