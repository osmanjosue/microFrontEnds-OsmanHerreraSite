<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <title>Criatura Secreta</title>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Metadato Criatura Confidencial</dc:title>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="purple-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd6fb" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00363a" />
    </linearGradient>
  </defs>
  <g id="Capa_personaje" data-name="Capa_criatura">
    <!-- Silueta de cabeza geométrica de bestia cibernética -->
    <path fill="#121318" stroke="#1f212a" stroke-width="4" d="M 400 100 L 580 220 L 680 440 L 400 700 L 120 440 L 220 220 Z" />
    <!-- Orejas tácticas angulares -->
    <polygon points="220,220 280,80 340,240" fill="#1a1b20" stroke="#00f0ff" stroke-width="1.5" />
    <polygon points="580,220 520,80 460,240" fill="#1a1b20" stroke="#00f0ff" stroke-width="1.5" />
    <!-- Ojos lumínicos y máscara central -->
    <path fill="url(#purple-cyan-grad)" d="M 400 280 L 520 380 L 400 520 L 280 380 Z" />
    <polygon points="320,380 360,400 320,420" fill="#ffd795" />
    <polygon points="480,380 440,400 480,420" fill="#ffd795" />
    <!-- Trama raster de semitonos táctica (técnica mixta) -->
    <image x="320" y="320" width="160" height="160" href="data:image/png;base64," />
    <!-- Mandíbula y colmillos de titanio -->
    <path fill="#292a2f" stroke="#3b494b" stroke-width="2" d="M 330 520 L 470 520 L 430 640 L 400 660 L 370 640 Z" />
    <polygon points="360,540 380,600 370,540" fill="#e3e1e9" />
    <polygon points="440,540 420,600 430,540" fill="#e3e1e9" />
  </g>
</svg>
